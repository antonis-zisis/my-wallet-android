query GetContracts($page: Int, $pageSize: Int, $expired: Boolean, $search: String, $sortBy: ContractSortField, $sortOrder: SortOrder) {
  contracts(page: $page, pageSize: $pageSize, expired: $expired, search: $search, sortBy: $sortBy, sortOrder: $sortOrder) {
    items {
      id
      category
      provider
      plan
      startDate
      endDate
      cost
      isExpired
      createdAt
      updatedAt
    }
    totalCount
  }
}

mutation CreateContract($input: CreateContractInput!) {
  createContract(input: $input) {
    id
    category
    provider
    plan
    startDate
    endDate
    cost
    isExpired
    createdAt
    updatedAt
  }
}

mutation UpdateContract($input: UpdateContractInput!) {
  updateContract(input: $input) {
    id
    category
    provider
    plan
    startDate
    endDate
    cost
    isExpired
    createdAt
    updatedAt
  }
}

mutation DeleteContract($id: ID!) {
  deleteContract(id: $id)
}
