query GetReports($page: Int, $pageSize: Int, $search: String, $sortBy: ReportSortField, $sortOrder: SortOrder) {
  reports(page: $page, pageSize: $pageSize, search: $search, sortBy: $sortBy, sortOrder: $sortOrder) {
    items {
      id
      title
      isLocked
      transactionCount
      netBalance
      createdAt
      updatedAt
    }
    totalCount
  }
}

query GetReport($id: ID!) {
  report(id: $id) {
    id
    title
    isLocked
    myRole
    members {
      id
      userId
      email
      fullName
      role
    }
    createdAt
    updatedAt
    transactions {
      id
      reportId
      type
      amount
      description
      category
      date
      createdAt
      updatedAt
    }
  }
}

query GetReportsSummary {
  reports {
    items {
      id
      title
      transactions {
        type
        amount
      }
    }
    totalCount
  }
}

mutation CreateReport($input: CreateReportInput!) {
  createReport(input: $input) {
    id
    title
    createdAt
    updatedAt
  }
}

mutation UpdateReport($input: UpdateReportInput!) {
  updateReport(input: $input) {
    id
    title
    updatedAt
  }
}

mutation DeleteReport($id: ID!) {
  deleteReport(id: $id)
}

mutation LockReport($id: ID!) {
  lockReport(id: $id) {
    id
    isLocked
  }
}

mutation UnlockReport($id: ID!) {
  unlockReport(id: $id) {
    id
    isLocked
  }
}

mutation ShareReport($input: ShareReportInput!) {
  shareReport(input: $input) {
    id
    members {
      id
      userId
      email
      fullName
      role
    }
  }
}

mutation UpdateReportShareRole($input: UpdateReportShareRoleInput!) {
  updateReportShareRole(input: $input) {
    id
    members {
      id
      userId
      email
      fullName
      role
    }
  }
}

mutation UnshareReport($id: ID!) {
  unshareReport(id: $id) {
    id
    members {
      id
      userId
      email
      fullName
      role
    }
  }
}

mutation LeaveSharedReport($reportId: ID!) {
  leaveSharedReport(reportId: $reportId)
}
