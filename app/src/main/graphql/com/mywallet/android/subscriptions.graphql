query GetSubscriptions($page: Int, $pageSize: Int, $active: Boolean, $sortBy: SubscriptionSortField, $sortOrder: SortOrder) {
  subscriptions(page: $page, pageSize: $pageSize, active: $active, sortBy: $sortBy, sortOrder: $sortOrder) {
    items {
      id
      name
      amount
      billingCycle
      isActive
      startDate
      endDate
      cancelledAt
      trialEndsAt
      category
      notes
      paymentMethod
      url
      monthlyCost
      createdAt
      updatedAt
    }
    totalCount
  }
}

mutation CreateSubscription($input: CreateSubscriptionInput!) {
  createSubscription(input: $input) {
    id
    name
    amount
    billingCycle
    isActive
    startDate
    endDate
    cancelledAt
    trialEndsAt
    monthlyCost
    createdAt
    updatedAt
  }
}

mutation UpdateSubscription($input: UpdateSubscriptionInput!) {
  updateSubscription(input: $input) {
    id
    name
    amount
    billingCycle
    isActive
    startDate
    endDate
    cancelledAt
    trialEndsAt
    monthlyCost
    createdAt
    updatedAt
  }
}

mutation CancelSubscription($id: ID!) {
  cancelSubscription(id: $id) {
    id
    isActive
  }
}

mutation ResumeSubscription($input: ResumeSubscriptionInput!) {
  resumeSubscription(input: $input) {
    id
    name
    amount
    billingCycle
    isActive
    startDate
    endDate
    cancelledAt
    trialEndsAt
    monthlyCost
    createdAt
    updatedAt
  }
}

mutation DeleteSubscription($id: ID!) {
  deleteSubscription(id: $id)
}
